<!doctype html><html><head><meta charset="utf-8">
<!-- Source of web/img/og.png (the 1200x630 share card). Render at 1200x630, deviceScaleFactor 2, then downscale to 1200x630. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--paper:#fffaf0;--ink:#1d1a12;--hen:#ffd54a;--egg:#7ec8e3;--red:#ef4b3c;--muted:#6b644f}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Fredoka,sans-serif;color:var(--ink);
background:radial-gradient(circle at 18% 30%,#fff0b8 0,transparent 42%),radial-gradient(circle at 85% 80%,#e0f3fa 0,transparent 45%),
radial-gradient(#e8dfc6 1.6px,transparent 1.7px) 0 0/26px 26px,var(--paper);position:relative}
.card{position:absolute;inset:34px;border:4px solid var(--ink);border-radius:46px 30px 42px 28px/28px 42px 30px 46px;box-shadow:9px 10px 0 var(--ink);background:rgba(255,255,255,.55)}
.title{position:absolute;left:84px;top:78px;font-size:96px;font-weight:700;letter-spacing:-1px;line-height:1}
.title u{text-decoration:none;background:linear-gradient(transparent 70%,var(--hen) 70%,var(--hen) 92%,transparent 92%)}
.sub{position:absolute;left:88px;top:196px;font-size:38px;font-weight:600;color:#3b3626}
.sub2{position:absolute;left:88px;top:248px;font-size:28px;font-weight:500;color:var(--muted);width:600px;line-height:1.3}
.chips{position:absolute;left:84px;top:338px;display:flex;gap:14px 14px;flex-wrap:wrap;width:620px}
.chip{font-size:24px;font-weight:700;padding:8px 20px;border:3px solid var(--ink);border-radius:255px 22px 225px 22px/22px 225px 22px 255px;box-shadow:4px 5px 0 var(--ink);background:#fff}
.h{background:var(--hen)} .e{background:var(--egg)} .r{background:#dcf3dc}
.url{position:absolute;left:84px;bottom:66px;font-size:34px;font-weight:700;padding:10px 26px;background:var(--hen);border:3.5px solid var(--ink);border-radius:18px 26px 16px 24px;box-shadow:5px 6px 0 var(--ink);transform:rotate(-1.5deg)}
.near{position:absolute;left:545px;bottom:76px;font-size:24px;font-weight:600;color:#fff;background:var(--ink);padding:9px 18px;border-radius:12px}
.st{position:absolute;filter:drop-shadow(5px 6px 0 rgba(29,26,18,.9))}
.vs{position:absolute;left:880px;top:200px;width:150px;height:150px;transform:rotate(-8deg)}
</style></head><body>

</svg>
